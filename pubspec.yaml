name: secure_ride_sharing
description: Secure Private Ride Sharing and Location Tracking System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (exact versions - do not use ^ here, newer patches 6.5.5/6.7.0 have a known plugin registration bug)
  firebase_core: 4.11.0
  firebase_auth: 6.5.4
  cloud_firestore: 6.6.0
  firebase_storage: 13.4.3

  # State Management
  provider: ^6.1.2

  # Maps & Location
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # HTTP & APIs
  http: ^1.2.1
  dio: ^5.4.3+1

  # Email / SOS
  mailer: ^7.1.0

  # UI & UX
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.1
  fluttertoast: ^9.1.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  animate_do: ^5.1.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  flutter_phone_direct_caller: ^2.1.1
  permission_handler: ^12.0.3
  image_picker: ^1.1.1
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^7.1.1
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - .env